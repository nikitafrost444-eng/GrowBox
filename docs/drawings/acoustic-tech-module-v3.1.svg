<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1450" height="1840" viewBox="0 0 1450 1840" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <pattern id="wood" width="14" height="14" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="14" height="14" fill="#D9B27C"/>
      <line x1="0" y1="0" x2="0" y2="14" stroke="#B08A54" stroke-width="2"/>
    </pattern>
    <pattern id="wool" width="12" height="12" patternUnits="userSpaceOnUse">
      <rect width="12" height="12" fill="#F2D98C"/>
      <circle cx="3" cy="3" r="1.6" fill="#C9A94A"/>
      <circle cx="9" cy="9" r="1.6" fill="#C9A94A"/>
    </pattern>
    <pattern id="perf" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#E8ECEF"/>
      <circle cx="5" cy="5" r="1.8" fill="#7A8894"/>
    </pattern>
    <pattern id="rubber" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="8" height="8" fill="#3B3B3B"/>
      <line x1="0" y1="0" x2="0" y2="8" stroke="#111" stroke-width="3"/>
    </pattern>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#0A7FB8"/>
    </marker>
    <marker id="arrG" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2E7D32"/>
    </marker>
    <marker id="dimT" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 5 L 10 5" stroke="#444" stroke-width="1.6"/>
    </marker>
    <style>
      .t   { fill:#1A1A1A; font-size:15px; }
      .ts  { fill:#333; font-size:13px; }
      .tb  { fill:#123; font-size:19px; font-weight:700; }
      .th  { fill:#0A4A73; font-size:16px; font-weight:700; }
      .dim { stroke:#444; stroke-width:1.2; fill:none; }
      .dimtxt { fill:#333; font-size:14px; }
      .lead { stroke:#555; stroke-width:1; fill:none; }
      .air { stroke:#0A7FB8; stroke-width:2.4; fill:none; stroke-dasharray:9 6; }
      .metal { fill:#B9C4CC; stroke:#37474F; stroke-width:2; }
      .frame { fill:none; stroke:#37474F; stroke-width:2.5; }
    </style>
  </defs>

  <rect width="1450" height="1840" fill="#FFFFFF"/>
  <text class="tb" x="100" y="42">ГРОУБОКС v3.1 · ВЕРХНИЙ АКУСТИЧЕСКИЙ ТЕХМОДУЛЬ</text>
  <text class="t" x="100" y="66">Разрез А-А, план и узлы. Принцип: масса + поглощение + развязка. Размеры в мм, схема без масштаба.</text>

  <!-- ================= РАЗРЕЗ А-А ================= -->
  <text class="th" x="100" y="102">РАЗРЕЗ А-А · ВИД СБОКУ (ряд оборудования, ширина 1250)</text>

  <!-- корпус модуля -->
  <rect x="100" y="110" width="1250" height="18" fill="url(#wood)" stroke="#8A6B3F" stroke-width="1.5"/>
  <rect x="100" y="110" width="18" height="350" fill="url(#wood)" stroke="#8A6B3F" stroke-width="1.5"/>
  <rect x="1332" y="110" width="18" height="350" fill="url(#wood)" stroke="#8A6B3F" stroke-width="1.5"/>
  <rect x="100" y="442" width="1250" height="18" fill="url(#wood)" stroke="#8A6B3F" stroke-width="1.5"/>
  <!-- приточные отверстия в полу модуля -->
  <rect x="200" y="442" width="140" height="18" fill="#FFFFFF" stroke="#8A6B3F" stroke-width="1.5"/>
  <rect x="600" y="442" width="140" height="18" fill="#FFFFFF" stroke="#8A6B3F" stroke-width="1.5"/>
  <rect x="1000" y="442" width="140" height="18" fill="#FFFFFF" stroke="#8A6B3F" stroke-width="1.5"/>
  <!-- внутренняя обшивка (перфорация) по стенам -->
  <rect x="118" y="128" width="8" height="314" fill="url(#perf)" stroke="#7A8894" stroke-width="1"/>
  <rect x="1324" y="128" width="8" height="314" fill="url(#perf)" stroke="#7A8894" stroke-width="1"/>
  <rect x="118" y="128" width="1206" height="8" fill="url(#perf)" stroke="#7A8894" stroke-width="1"/>

  <!-- фильтр (отдельный подвес) -->
  <line x1="240" y1="136" x2="240" y2="252" stroke="#6D4C41" stroke-width="3"/>
  <line x1="480" y1="136" x2="480" y2="252" stroke="#6D4C41" stroke-width="3"/>
  <rect x="226" y="132" width="28" height="12" fill="url(#rubber)" stroke="#222" stroke-width="1"/>
  <rect x="466" y="132" width="28" height="12" fill="url(#rubber)" stroke="#222" stroke-width="1"/>
  <rect x="160" y="252" width="400" height="150" rx="12" class="metal"/>
  <rect x="170" y="262" width="380" height="130" rx="8" fill="#6E8B9B" stroke="#37474F" stroke-width="1.2"/>
  <text class="t" x="205" y="332" fill="#FFFFFF">УГОЛЬНЫЙ ФИЛЬТР SF 4"</text>

  <!-- гибкая вставка 1 -->
  <rect x="560" y="272" width="100" height="100" fill="#DCE6EC" stroke="#37474F" stroke-width="1.6"/>
  <path d="M 572 272 L 572 372 M 590 272 L 590 372 M 608 272 L 608 372 M 626 272 L 626 372 M 644 272 L 644 372" stroke="#7B95A5" stroke-width="1.4"/>

  <!-- вентилятор SF4 -->
  <rect x="660" y="242" width="280" height="160" rx="14" class="metal"/>
  <circle cx="800" cy="322" r="46" fill="#8FA6B4" stroke="#37474F" stroke-width="2"/>
  <circle cx="800" cy="322" r="18" fill="#37474F"/>
  <path d="M 800 322 L 838 296 M 800 322 L 762 296 M 800 322 L 838 348 M 800 322 L 762 348" stroke="#37474F" stroke-width="4"/>
  <text class="t" x="700" y="228">SF 4" · Ø160×280 · на виброопорах</text>

  <!-- гибкая вставка 2 -->
  <rect x="940" y="272" width="100" height="100" fill="#DCE6EC" stroke="#37474F" stroke-width="1.6"/>
  <path d="M 952 272 L 952 372 M 970 272 L 970 372 M 988 272 L 988 372 M 1006 272 L 1006 372 M 1024 272 L 1024 372" stroke="#7B95A5" stroke-width="1.4"/>
  <text class="ts" x="560" y="262">гибкая вставка 100</text>
  <text class="ts" x="940" y="262">гибкая вставка 100</text>

  <!-- шумоглушитель -->
  <rect x="1040" y="222" width="300" height="180" rx="12" class="metal"/>
  <line x1="1055" y1="262" x2="1325" y2="262" stroke="#37474F" stroke-width="2"/>
  <line x1="1055" y1="302" x2="1325" y2="302" stroke="#37474F" stroke-width="2"/>
  <line x1="1055" y1="342" x2="1325" y2="342" stroke="#37474F" stroke-width="2"/>
  <line x1="1055" y1="382" x2="1325" y2="382" stroke="#37474F" stroke-width="2"/>
  <text class="t" x="1052" y="210">ШУМОГЛУШИТЕЛЬ Ø180×300</text>

  <!-- площадка + виброопоры -->
  <rect x="620" y="402" width="720" height="20" fill="#90A4AE" stroke="#37474F" stroke-width="1.6"/>
  <rect x="700" y="422" width="46" height="20" fill="url(#rubber)" stroke="#222" stroke-width="1.2"/>
  <rect x="1180" y="422" width="46" height="20" fill="url(#rubber)" stroke="#222" stroke-width="1.2"/>
  <path class="lead" d="M 723 442 L 640 468"/>
  <text class="ts" x="530" y="476">площадка 20 + виброопоры каучуковые 4× (2 видно в разрезе)</text>

  <!-- фильтр подвесы -->
  <path class="lead" d="M 480 168 L 502 196"/>
  <text class="ts" x="500" y="206">отдельный виброподвес фильтра (шпильки + резина)</text>

  <!-- воздух -->
  <path class="air" d="M 270 436 L 270 412" marker-end="url(#arr)"/>
  <path class="air" d="M 670 436 L 670 412" marker-end="url(#arr)"/>
  <path class="air" d="M 1070 436 L 1070 412" marker-end="url(#arr)"/>
  <path class="air" d="M 200 322 L 555 322" marker-end="url(#arr)"/>
  <path class="air" d="M 668 322 L 788 322" marker-end="url(#arr)"/>
  <path class="air" d="M 812 322 L 935 322" marker-end="url(#arr)"/>
  <path class="air" d="M 1048 322 L 1335 322" marker-end="url(#arr)"/>
  <path class="air" d="M 1335 322 C 1380 322 1385 360 1380 392" marker-end="url(#arr)"/>
  <text class="ts" x="1120" y="360" fill="#0A7FB8">поток → в пленум (см. план)</text>
  <text class="ts" x="120" y="432" fill="#0A7FB8">вход из зоны растений</text>

  <!-- размеры -->
  <line class="dim" x1="100" y1="492" x2="1350" y2="492" marker-start="url(#dimT)" marker-end="url(#dimT)"/>
  <line class="dim" x1="100" y1="462" x2="100" y2="500"/>
  <line class="dim" x1="1350" y1="462" x2="1350" y2="500"/>
  <rect x="705" y="480" width="60" height="20" fill="#FFF"/>
  <text class="dimtxt" x="712" y="496">1250</text>
  <line class="dim" x1="62" y1="110" x2="62" y2="460" marker-start="url(#dimT)" marker-end="url(#dimT)"/>
  <line class="dim" x1="55" y1="110" x2="100" y2="110"/>
  <line class="dim" x1="55" y1="460" x2="100" y2="460"/>
  <text class="dimtxt" x="30" y="290">350</text>

  <!-- ================= ПЛАН ================= -->
  <text class="th" x="100" y="640">ПЛАН ТЕХМОДУЛЯ · ВИД СВЕРХУ (1250×700)</text>
  <rect x="100" y="650" width="1250" height="700" fill="url(#wood)" stroke="#8A6B3F" stroke-width="1.5"/>
  <rect x="118" y="668" width="1214" height="664" fill="#FFFFFF" stroke="#8A6B3F" stroke-width="1.5"/>

  <!-- оборудование в плане -->
  <rect x="160" y="900" width="400" height="150" rx="12" class="metal"/>
  <text class="ts" x="220" y="982">ФИЛЬТР (ось по ширине)</text>
  <rect x="560" y="925" width="100" height="100" fill="#DCE6EC" stroke="#37474F" stroke-width="1.6"/>
  <rect x="660" y="900" width="280" height="160" rx="14" class="metal"/>
  <circle cx="800" cy="980" r="40" fill="#8FA6B4" stroke="#37474F" stroke-width="2"/>
  <text class="ts" x="722" y="986">SF 4"</text>
  <rect x="940" y="925" width="100" height="100" fill="#DCE6EC" stroke="#37474F" stroke-width="1.6"/>
  <rect x="1040" y="890" width="300" height="180" rx="12" class="metal"/>
  <text class="ts" x="1105" y="986">ШУМОГЛУШИТЕЛЬ</text>

  <!-- пленум -->
  <text class="t" x="150" y="1130">ПЛЕНУМ (расширительная камера) — скорость потока падает</text>
  <rect x="960" y="1070" width="22" height="170" fill="url(#rubber)" stroke="#222" stroke-width="1.2"/>
  <text class="ts" x="820" y="1120">лабиринтная перегородка:</text>
  <text class="ts" x="820" y="1138">нет прямой линии звука к решётке</text>

  <!-- решётка -->
  <rect x="280" y="1318" width="600" height="14" fill="#E8ECEF" stroke="#37474F" stroke-width="1.5"/>
  <path d="M 320 1318 L 320 1332 M 360 1318 L 360 1332 M 400 1318 L 400 1332 M 440 1318 L 440 1332 M 480 1318 L 480 1332 M 520 1318 L 520 1332 M 560 1318 L 560 1332 M 600 1318 L 600 1332 M 640 1318 L 640 1332 M 680 1318 L 680 1332 M 720 1318 L 720 1332 M 760 1318 L 760 1332 M 800 1318 L 800 1332 M 840 1318 L 840 1332" stroke="#37474F" stroke-width="1.2"/>
  <text class="t" x="280" y="1310">РЕШЁТКА 600×250 в комнату · 0,15 м² → ≈0,4 м/с</text>

  <!-- воздух в плане -->
  <path class="air" d="M 1335 980 C 1372 1000 1370 1080 1330 1120" marker-end="url(#arr)"/>
  <path class="air" d="M 1320 1160 C 1290 1230 1250 1275 1200 1285" marker-end="url(#arr)"/>
  <path class="air" d="M 1180 1285 L 900 1285" marker-end="url(#arr)"/>
  <path class="air" d="M 890 1285 C 880 1300 870 1310 850 1316" marker-end="url(#arr)"/>
  <path class="air" d="M 600 1336 L 520 1368" marker-end="url(#arr)"/>
  <text class="ts" x="500" y="1390" fill="#0A7FB8">в комнату</text>

  <!-- вход из зоны -->
  <circle cx="270" cy="830" r="55" fill="none" stroke="#0A7FB8" stroke-width="2" stroke-dasharray="8 6"/>
  <circle cx="670" cy="830" r="55" fill="none" stroke="#0A7FB8" stroke-width="2" stroke-dasharray="8 6"/>
  <circle cx="1070" cy="830" r="55" fill="none" stroke="#0A7FB8" stroke-width="2" stroke-dasharray="8 6"/>
  <path class="air" d="M 270 890 L 270 940" marker-end="url(#arr)"/>
  <path class="air" d="M 670 890 L 670 940" marker-end="url(#arr)"/>
  <path class="air" d="M 1070 890 L 1070 930" marker-end="url(#arr)"/>
  <text class="ts" x="140" y="770" fill="#0A7FB8">вход из зоны растений: 3× Ø120 (снизу, через перекрытие)</text>

  <!-- размеры плана -->
  <line class="dim" x1="100" y1="1382" x2="1350" y2="1382" marker-start="url(#dimT)" marker-end="url(#dimT)"/>
  <line class="dim" x1="100" y1="1352" x2="100" y2="1390"/>
  <line class="dim" x1="1350" y1="1352" x2="1350" y2="1390"/>
  <rect x="705" y="1370" width="60" height="20" fill="#FFF"/>
  <text class="dimtxt" x="712" y="1386">1250</text>
  <line class="dim" x1="1382" y1="650" x2="1382" y2="1350" marker-start="url(#dimT)" marker-end="url(#dimT)"/>
  <line class="dim" x1="1352" y1="650" x2="1390" y2="650"/>
  <line class="dim" x1="1352" y1="1350" x2="1390" y2="1350"/>
  <text class="dimtxt" x="1394" y="1005">700</text>

  <!-- ================= ДЕТАЛЬ 1 ================= -->
  <text class="th" x="100" y="1450">ДЕТАЛЬ 1 · СТЕНКА ШУМОБОКСА (слева внутр. обшивка → справа наружу)</text>
  <rect x="120" y="1480" width="30" height="170" fill="url(#perf)" stroke="#37474F" stroke-width="1.5"/>
  <rect x="150" y="1480" width="55" height="170" fill="#FFFFFF" stroke="#37474F" stroke-width="1.5"/>
  <rect x="205" y="1480" width="95" height="170" fill="url(#wool)" stroke="#37474F" stroke-width="1.5"/>
  <rect x="300" y="1480" width="58" height="170" fill="url(#wood)" stroke="#37474F" stroke-width="1.5"/>
  <path class="lead" d="M 135 1495 L 385 1497"/>
  <text class="ts" x="392" y="1501">8 мм перфорир. обшивка (внутр.)</text>
  <path class="lead" d="M 177 1535 L 385 1537"/>
  <text class="ts" x="392" y="1541">20 мм воздушный зазор</text>
  <path class="lead" d="M 252 1575 L 385 1577"/>
  <text class="ts" x="392" y="1581">40 мм минвата в обойме (стеклоткань)</text>
  <path class="lead" d="M 329 1615 L 385 1617"/>
  <text class="ts" x="392" y="1621">18 мм ЛДСП/фанера — масса</text>
  <text class="ts" x="120" y="1672" fill="#B71C1C">поролон НЕ клеим: пыль/волокна в тракт и на электрику</text>

  <!-- ================= ДЕТАЛЬ 2 ================= -->
  <text class="th" x="760" y="1450">ДЕТАЛЬ 2 · ВИБРОРАЗВЯЗКА SF 4"</text>
  <rect x="880" y="1480" width="260" height="55" rx="10" class="metal"/>
  <text class="ts" x="945" y="1514">корпус SF4</text>
  <rect x="855" y="1535" width="310" height="22" fill="#90A4AE" stroke="#37474F" stroke-width="1.5"/>
  <rect x="905" y="1557" width="50" height="30" fill="url(#rubber)" stroke="#222" stroke-width="1.2"/>
  <circle cx="930" cy="1572" r="7" fill="#FFF"/>
  <rect x="1065" y="1557" width="50" height="30" fill="url(#rubber)" stroke="#222" stroke-width="1.2"/>
  <circle cx="1090" cy="1572" r="7" fill="#FFF"/>
  <rect x="835" y="1587" width="350" height="22" fill="url(#wood)" stroke="#8A6B3F" stroke-width="1.5"/>
  <path class="lead" d="M 1010 1546 L 1180 1520"/>
  <text class="ts" x="1185" y="1516">монтажная площадка 20 мм</text>
  <path class="lead" d="M 930 1587 L 795 1600"/>
  <text class="ts" x="762" y="1604">виброопоры 4×, каучук</text>
  <path class="lead" d="M 1010 1609 L 1180 1622"/>
  <text class="ts" x="1185" y="1626">полка корпуса (не жёстко!)</text>
  <text class="ts" x="762" y="1660">Фильтр — на отдельных виброподвесах. Между фильтром/вентилятором/глушителем —</text>
  <text class="ts" x="762" y="1680">гибкие вставки 100 мм с хомутами. Мотор не должен касаться стенок шкафа.</text>

  <!-- ================= ПРИМЕЧАНИЯ ================= -->
  <rect x="100" y="1722" width="1250" height="100" fill="#F4F7F9" stroke="#90A4AE" stroke-width="1.2"/>
  <text class="ts" x="115" y="1744">1. Тракт: зона растений → фильтр → гибкая вставка → SF4 → гибкая вставка → шумоглушитель → пленум (с лабиринтной перегородкой) → решётка в комнату.</text>
  <text class="ts" x="115" y="1766">2. Бюджет сопротивления: фильтр угольный 30–50 Па + глушитель 10–15 Па + повороты/решётка ≤10 Па ≈ ≤70 Па. Режим SF4 — 35–50%, запас есть.</text>
  <text class="ts" x="115" y="1788">3. Скорость на решётке ≤0,5 м/с = низкий аэродинамический шум. Не сужать решётку и проходы: лабиринт делаем крупным, без острых поворотов.</text>
  <text class="ts" x="115" y="1810">4. GGS/AC10, ИБП и водяные магистрали — ВНЕ акустической камеры (сухая сервисная колонна). Габариты узлов уточнить по факту: SF4/фильтр/глушитель.</text>
</svg>
